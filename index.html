<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Selector · ¿Quién presenta?</title>
  <meta name="description" content="Minijuegos para elegir al azar quién presenta la próxima weekly.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f3f5ff'/%3E%3Cpath d='M2 16a14 14 0 0 1 28 0z' fill='%23ff4d8d'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/game-shared.css">
  <link rel="stylesheet" href="css/gachapon.css">
  <link rel="stylesheet" href="css/plinko.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="#/">
        <span class="brand-logo" aria-hidden="true"></span>
        <span class="brand-text"><b>Selector</b><small>¿Quién presenta la weekly?</small></span>
      </a>
      <nav class="tabs" id="tabs" aria-label="Juegos"></nav>
      <div class="top-actions">
        <button class="icon-btn" id="muteBtn" type="button" title="Sonido">🔊</button>
        <button class="people-btn" id="peopleBtn" type="button" aria-label="Participantes">👥 <span id="peopleCount">0</span></button>
      </div>
    </header>

    <main class="main">
      <section class="stage" id="stage" aria-live="polite"></section>

      <aside class="panel" id="panel" aria-label="Participantes">
        <div class="panel-head">
          <h2>Participantes</h2>
          <span class="pill" id="poolInfo">0 en juego</span>
          <button class="icon-btn close-panel" id="closePanel" type="button" aria-label="Cerrar">✕</button>
        </div>

        <form class="add-form" id="addForm" autocomplete="off">
          <textarea id="namesInput" rows="4" placeholder="Escribí un nombre y Enter…&#10;o pegá la lista entera del equipo:&#10;Ana&#10;Bruno, Carla, Diego"></textarea>
          <div class="add-row">
            <p class="help">Uno por línea o separados por coma · Shift+Enter = nueva línea</p>
            <button type="submit" class="btn btn-add">Agregar</button>
          </div>
        </form>
        <p class="help">Tocá un nombre para marcarlo <b>ausente</b>.</p>

        <ul class="chips" id="chips"></ul>
        <div class="empty-list" id="emptyList" hidden>Todavía no hay nadie.<br>¡Sumá a tu equipo! 👆</div>

        <div class="panel-tools">
          <button class="link-btn" id="shareBtn" type="button">🔗 Copiar link con la lista</button>
          <button class="link-btn danger" id="clearBtn" type="button">Vaciar</button>
        </div>

        <div class="card">
          <label class="switch">
            <input type="checkbox" id="noRepeat">
            <span class="slider" aria-hidden="true"></span>
            <span>Sin repetir hasta que pasen todos</span>
          </label>
          <div class="round" id="roundInfo"></div>
          <div class="progress" id="roundProgress"><span id="roundBar"></span></div>
        </div>

        <details class="card history" id="historyBox">
          <summary class="card-head">
            <h3>Historial <span class="h-last" id="historyLast"></span></h3>
            <button class="link-btn" id="clearHistory" type="button">Borrar</button>
          </summary>
          <ol id="historyList"></ol>
        </details>
      </aside>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="js/core.js"></script>
  <script src="js/games/gachapon.js"></script>
  <script src="js/games/plinko.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
